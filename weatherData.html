<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Weather Check</title>
</head>
<body>
  <h1>Travel Weather Check</h1>
  <p>Enter a city name to fetch the current temperature.</p>

  <form id="weather-form">
    <label for="city">City</label>
    <input type="text" id="city" name="city" placeholder="e.g. Sydney">
    <button type="submit" id="checkBtn">Check Weather</button>
  </form>

  <div id="output"></div>

  <script src="weatherData.js"></script>
</body>
</html>

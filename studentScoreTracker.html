<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Score Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #ffd7a8 0%, #ffc07a 55%, #ffb15c 100%);
      color: #fff;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px 48px;
      text-align: center;
    }

    h1 {
      margin: 0 0 36px;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 8px rgba(255, 140, 40, 0.25);
    }

    .form-card,
    .score-item {
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(255, 140, 60, 0.12);
    }

    .form-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 22px 28px;
      margin-bottom: 48px;
    }

    input {
      width: 180px;
      height: 48px;
      border: none;
      outline: none;
      border-radius: 24px;
      background: #f3f4f6;
      text-align: center;
      font-size: 16px;
      color: #374151;
    }

    input::placeholder {
      color: #9ca3af;
    }

    #addBtn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #22c55e;
      color: #fff;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    #addBtn:hover {
      background: #16a34a;
    }

    #error {
      min-height: 28px;
      margin: 0 0 28px;
      color: #ef4444;
      font-size: 22px;
      font-weight: 700;
    }

    #scoreList {
      list-style: none;
      padding: 0;
      margin: 0 0 48px;
    }

    .score-item {
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 28px;
      margin-bottom: 14px;
      color: #4b5563;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }

    #average {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(255, 140, 40, 0.2);
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>🎓 Student Score Tracker</h1>

    <form id="scoreForm" class="form-card">
      <input type="text" id="studentName" placeholder="Student Name" autocomplete="off">
      <input type="text" id="studentScore" placeholder="Score" autocomplete="off">
      <button type="submit" id="addBtn" aria-label="Add">+</button>
    </form>

    <p id="error"></p>
    <ul id="scoreList"></ul>
    <p id="average">Average Score: 0</p>
  </div>

  <script src="studentScoreTracker.js"></script>
</body>
</html>
